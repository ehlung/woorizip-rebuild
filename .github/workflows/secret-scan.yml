# 커밋에 비밀값이 들어갔는지 검사한다 (docs/adr/0014-secrets-and-config.md).
# 개인 계정 저장소라 GITLEAKS_LICENSE는 필요 없다.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
