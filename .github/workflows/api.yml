# API 서버(apps/api)의 테스트를 실행한다 (docs/adr/0016-local-and-test.md).
#
# main의 필수 검사로 쓰기 위해 workflow 자체는 모든 PR에서 실행한다.
# workflow를 paths로 건너뛰면 필수 검사가 "Pending"으로 남아 병합이 막히고,
# job을 if 조건으로 건너뛰면 "Success"로 보고된다.
# https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
name: api

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: api-changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.diff.outputs.api }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        name: apps/api 변경 여부 확인
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(apps/api/|packages/api-client/|package-lock\.json$|\.nvmrc$|\.github/workflows/api\.yml$)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: api-test
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      # 실행할 때마다 Gradle wrapper가 공식 배포본인지도 확인한다.
      - uses: gradle/actions/setup-gradle@v6
      - name: 테스트
        run: ./gradlew test
      # 테스트(OpenApiSpecTest)가 packages/api-client/openapi.json을 새로 쓴다.
      # 그 명세로 앱용 클라이언트를 다시 생성해, 커밋된 것과 다르면 실패한다 (ADR 0006).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: API 명세와 앱용 클라이언트가 커밋된 것과 같은지 확인
        working-directory: .
        run: |
          npm ci
          npm run generate --workspace @woorizip/api-client
          npm run typecheck --workspace @woorizip/api-client
          if [ -n "$(git status --porcelain -- packages/api-client)" ]; then
            git status --porcelain -- packages/api-client
            echo "서버 API가 바뀌었는데 클라이언트를 다시 생성하지 않았습니다."
            echo "apps/api에서 ./gradlew test, 저장소 루트에서 npm run generate --workspace @woorizip/api-client를 실행하고 결과를 커밋하세요."
            exit 1
          fi
