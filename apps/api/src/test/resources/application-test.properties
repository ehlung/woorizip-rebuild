# 테스트 설정. 테스트 클래스에 @ActiveProfiles("test")를 붙여 쓴다.
# DB는 Testcontainers가 띄운 PostgreSQL에 자동으로 연결한다 (TestcontainersConfiguration).

# 테스트할 때마다 새 서명 키를 만든다. local 프로필과 같은 방식이다.
woorizip.auth.jwt.current-key-id=test
woorizip.auth.jwt.keys[0].id=test
woorizip.auth.jwt.keys[0].secret=${random.value}${random.value}

springdoc.api-docs.enabled=true

# 테스트는 메일 재시도 스케줄을 끄고 MailDispatcher.dispatchDue()를 직접 부른다.
woorizip.mail.dispatcher.enabled=false

# 테스트는 커밋 직후 메일을 요청 스레드에서 보내 결과를 바로 확인한다. 다른 스레드에서 보내는 것은 MailAsyncSendTest가 확인한다.
woorizip.mail.send-async=false
