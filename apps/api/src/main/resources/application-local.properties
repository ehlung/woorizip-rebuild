# 로컬 개발용 설정. infra/docker-compose.yml의 PostgreSQL에 연결한다.
# 값은 infra/.env.example의 기본값과 같고, 바꾸려면 같은 이름의 환경 변수를 준다.
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:woorizip}
spring.datasource.username=${POSTGRES_USER:woorizip}
spring.datasource.password=${POSTGRES_PASSWORD:woorizip}

# 서버를 켤 때마다 새 서명 키를 만든다. ${random.value}는 무작위 16바이트(128비트)를 16진수 32글자로 적은 값이라,
# 둘을 이어 무작위성 256비트를 만든다.
# 서버를 다시 켜면 이전 access token은 거부되고, 앱은 refresh token으로 다시 발급받는다 (ADR 0009).
woorizip.auth.jwt.current-key-id=local
woorizip.auth.jwt.keys[0].id=local
woorizip.auth.jwt.keys[0].secret=${random.value}${random.value}

springdoc.api-docs.enabled=true
