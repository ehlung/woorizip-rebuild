# 로컬 개발용 설정. infra/docker-compose.yml의 PostgreSQL에 연결한다.
# 값은 infra/.env.example의 기본값과 같고, 바꾸려면 같은 이름의 환경 변수를 준다.
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:woorizip}
spring.datasource.username=${POSTGRES_USER:woorizip}
spring.datasource.password=${POSTGRES_PASSWORD:woorizip}
