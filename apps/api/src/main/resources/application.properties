spring.application.name=api

# DB 접속 정보는 환경마다 다르므로 여기에 두지 않는다 (ADR 0014).
# 운영은 SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD 환경 변수로 주고,
# 로컬은 local 프로필(application-local.properties)을 쓴다. 값이 없으면 서버가 시작하지 않는다.

# 스키마는 Flyway 마이그레이션으로만 바꾸고, 엔티티와 스키마가 다르면 시작하지 않는다 (ADR 0010).
spring.jpa.hibernate.ddl-auto=validate
# 요청이 끝날 때까지 DB 세션을 열어 두지 않는다. 화면용 조회는 서비스 안에서 끝낸다.
spring.jpa.open-in-view=false

# access token(JWT) 설정 (ADR 0009). 서명 방식은 HS256이다.
woorizip.auth.jwt.issuer=woorizip
woorizip.auth.jwt.access-token-ttl=15m
# 서명 키는 여기에 두지 않는다. 운영은 Parameter Store에서 받고(ADR 0014), 로컬은 local 프로필에서 받는다.
# woorizip.auth.jwt.current-key-id, woorizip.auth.jwt.keys[0].id, woorizip.auth.jwt.keys[0].secret
# 값이 없으면 서버가 시작하지 않는다. 키는 32바이트(256비트) 이상이어야 한다 (RFC 7518 3.2).
# 서버는 길이만 검사할 수 있다. 운영 키는 openssl rand -base64 32처럼 무작위 32바이트 이상으로 만든다.

# OpenAPI 명세(/v3/api-docs). 운영에서는 열지 않고, 로컬과 테스트에서만 켠다.
# 앱용 클라이언트는 테스트가 만든 명세 파일(packages/api-client/openapi.json)로 생성한다 (ADR 0006).
springdoc.api-docs.enabled=false
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
